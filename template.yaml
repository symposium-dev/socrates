AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Socrates Zulip Bot - A serverless bot that responds with Socrates quotes

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: provided.al2
    Architectures:
      - x86_64

Resources:
  SocratesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: ./
      Handler: bootstrap
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /webhook
            Method: post
        DirectInvoke:
          Type: Api
          Properties:
            Path: /
            Method: get
      Environment:
        Variables:
          RUST_LOG: info

Outputs:
  SocratesApi:
    Description: "API Gateway endpoint URL for Socrates function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"